# PR마다 infra/의 plan만 보여 준다 (CAREER-25) — apply는 deploy.yml(main)만
name: plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/plan.yml"

permissions:
  id-token: write # OIDC (포크 PR은 토큰을 못 받음)
  contents: read

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform fmt -check
      - run: terraform validate
      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan | tee plan.txt
          echo "### terraform plan" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Plan:|No changes)' plan.txt >> "$GITHUB_STEP_SUMMARY" || true

      # HIGH · CRITICAL이 하나라도 있으면 막는다(CAREER-28). 남길 항목은 .trivyignore에 이유와 함께
      # trivy-action(v0.36.0)은 11/4 설치 단계(setup-trivy install.sh)가 exit 6으로 실패 → 공식 이미지를 digest로 고정해 바로 돌린다
      # (2026-03 trivy-action 태그 오염 사고(CVE-2026-33634) 뒤라 태그가 아닌 digest로)
      - name: trivy config (HIGH, CRITICAL)
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            config --severity HIGH,CRITICAL --exit-code 1 /src

# main에 합쳐지면 infra/를 AWS에 적용 (CAREER-10)
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"                     # 인프라 코드가 바뀌었을 때만
      - ".github/workflows/deploy.yml" # 이 파일이 바뀌었을 때도

# 신분증(OIDC 토큰)을 받을 수 있게 + 코드는 읽기만
permissions:
  id-token: write
  contents: read

# 배포는 한 번에 하나씩 (앞 배포를 끊지 않고 기다림)
concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra

    steps:
      # 저장소 코드 내려받기
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 신분증 → STS → 임시 키 (저장소에 AWS 키 없음)
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 내 맥과 같은 Terraform 버전
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.1

      - run: terraform init -input=false
      - run: terraform fmt -check       # 형식이 안 맞으면 여기서 멈춤
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan